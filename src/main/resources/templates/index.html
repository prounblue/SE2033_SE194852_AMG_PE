<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Artifact List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div th:if="${errorMessage}" style="color: red; margin-bottom: 10px;">
    <p th:text="${errorMessage}"></p>
</div>
<div th:if="${message}" style="color: green; margin-bottom: 10px;">
    <p th:text="${message}"></p>
</div>
<div class="container mt-4" style="border: 3px solid red; padding: 20px;">
    <h1>Artifact List</h1>
    <hr>
    <form th:action="@{/search}" method="post">
        <div class="row m-2 align-items-center">
            <div class="col-2">
                Artifact Name :
            </div>
            <div class="col-5">
                <input type="text" name="searchName" th:value="${searchName}" class="form-control" placeholder="Enter name to search...">
            </div>
            <div class="col-2">
                <input type="submit" value="Search" class="btn btn-primary"/>
            </div>
            <div class="col text-right">
                <a th:href="@{/add}" class="btn btn-secondary">Add New</a>
            </div>
        </div>
    </form>
    <div class="row mt-3">
        <table class="table table-bordered">
            <thead class="bg-secondary text-white">
            <tr>
                <th>Code</th>
                <th>Artifact Name</th>
                <th>Category</th>
                <th>Estimate Value ($)</th>
                <th>Acquisition Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="art : ${artifacts}">
                <td th:text="${art.artifactCode}">A01</td>
                <td th:text="${art.artifactName}">Vase</td>
                <td th:text="${art.category != null ? art.category.categoryName : 'N/A'}">Category</td>
                <td th:text="${art.estimatedValue}">1000</td>
                <td th:text="${art.acquisitionDate}">2026-01-01</td>
                <td th:text="${art.status}">Active</td>
                <td>
                    <a th:href="@{/view/{id}(id=${art.id})}">View</a> |
                    <a th:href="@{/delete/{id}(id=${art.id})}"
                       onclick="return confirm('Are you sure you want to delete this artifact?');">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(artifacts)}">
                <td colspan="7" class="text-center">No artifacts found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
